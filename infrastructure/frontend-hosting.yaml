AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time frontend hosting stack for Loveheartbeat.
  Creates an S3 bucket for the static Next.js export and a CloudFront distribution.

Parameters:
  Stage:
    Type: String
    Default: prod
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain name for the CloudFront distribution (e.g. loveheartbeat.com).
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for the custom domain. Required if DomainName is set and you want a certificate/record created.
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional existing ACM certificate ARN in us-east-1 for the custom domain. If not provided, a certificate will be created with DNS validation.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  CreateCertificate: !And
    - !Condition HasCustomDomain
    - !Equals [!Ref CertificateArn, ""]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub loveheartbeat-frontend-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

  FrontendOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub OAI for Loveheartbeat frontend ${Stage}

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # next.config.mjs sets trailingSlash: true, so the export writes
  # command-center/index.html rather than command-center.html. A request for
  # /command-center therefore has no matching S3 key, and because the bucket policy
  # (correctly) withholds s3:ListBucket, S3 answers 403 AccessDenied instead of 404 —
  # which CloudFront forwards as raw XML. Rewriting the URI here fixes every route at
  # once, including bookmarks and hand-typed URLs that no app-side change can reach.
  RewriteToIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub loveheartbeat-rewrite-index-${Stage}
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve extensionless paths to the Gulp-built .html files
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            // No extension in the last segment: a page request, not an asset.
            // Gulp emits flat files (apps/observability/logs.html), not directories,
            // so this appends .html rather than /index.html.
            request.uri = uri + '.html';
          }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Loveheartbeat frontend ${Stage}
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        Aliases: !If
          - HasCustomDomain
          - - !Ref DomainName
          - !Ref "AWS::NoValue"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${FrontendOriginAccessIdentity}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
          MinTTL: 0
          DefaultTTL: 3600
          MaxTTL: 86400
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteToIndexFunction.FunctionMetadata.FunctionARN
        # With the rewrite in place a 403 means a genuinely missing page, not a route.
        # Serving the app's 404 instead of S3's XML keeps the user inside the product.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn]
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"

  FrontendARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    DependsOn: FrontendDistribution
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendConfigSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub loveheartbeat/frontend-config-${Stage}
      Description: Frontend deployment config created by the frontend-hosting stack
      SecretString: !Join
        - ""
        - - '{"FRONTEND_S3_BUCKET":"'
          - !Ref FrontendBucket
          - '","CLOUDFRONT_DISTRIBUTION_ID":"'
          - !Ref FrontendDistribution
          - '","FRONTEND_URL":"'
          - !If [HasCustomDomain, !Sub "https://${DomainName}", !Sub "https://${FrontendDistribution}.cloudfront.net"]
          - '"}'

Outputs:
  FrontendBucket:
    Description: S3 bucket for the static Next.js export
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID for cache invalidation
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: CloudFront URL
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendConfigSecretArn:
    Description: Secrets Manager ARN with frontend deployment config
    Value: !Ref FrontendConfigSecret
