# The two stores rv-aiknowledge needs, locally.
#
#   docker compose -f backend/rvkg_bridge/docker-compose.yml up -d
#
# Both are the real thing. mongodb-atlas-local is the one image choice that matters:
# plain `mongo:7` has no $vectorSearch, so search_artifacts() silently falls through to
# its keyword path and every score comes back tagged "keyword" instead of "cosine" —
# the relevance gate's floor is calibrated on the cosine scale, so that is a different
# system being tested. atlas-local runs the search node in-process; no Atlas account.
#
# Deliberately off the default ports (7688/27018). Anything else you already run
# locally — another Neo4j, a project's own Mongo — keeps 7687 and 27017 and this stack
# never collides with it. run.sh knows these numbers; nothing else needs to.
services:
  neo4j:
    image: neo4j:5.22
    ports: ["7475:7474", "7688:7687"]
    environment:
      NEO4J_AUTH: neo4j/rvkglocal
      NEO4J_server_memory_heap_max__size: 512M
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p rvkglocal 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongodb/mongodb-atlas-local:latest
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
