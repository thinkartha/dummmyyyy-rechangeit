version = 0.1

[default]
[default.global.parameters]
stack_name = "loveheartbeat-backend"

[default.build.parameters]
cached = true
parallel = true
# NB: `cryptography` (via PyJWT[crypto]) ships a compiled wheel, so the build host's
# platform matters. deploy-backend.yml runs on ubuntu-latest and resolves Linux wheels;
# a build from a Mac needs `sam build --use-container` or the Lambda loads a macOS .so
# and every authenticated request 401s.

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "loveheartbeat-backend"
region = "us-east-1"
parameter_overrides = [
  "Stage=prod",
  "CognitoDomainPrefix=loveheartbeat",
  "LambdaMemory=512",
  "LambdaTimeout=30",
]

[prod.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "loveheartbeat-backend-prod"
region = "us-east-1"
parameter_overrides = [
  "Stage=prod",
  "CognitoDomainPrefix=loveheartbeat",
  "LambdaMemory=512",
  "LambdaTimeout=30",
]
