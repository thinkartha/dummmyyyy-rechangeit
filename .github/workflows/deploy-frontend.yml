name: deploy-frontend

# Builds the Pug/Gulp static frontend and deploys it to S3 / CloudFront.
# Triggered only when frontend code changes.

# Manual only. deploy-frontend-dev.yml calls this via workflow_call for the dev stage.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Deployment stage"
        required: true
        default: "prod"
      domain_name:
        description: "Optional custom domain for the frontend (e.g. loveheartbeat.com)"
        required: false
        default: ""
      hosted_zone_id:
        description: "Optional Route 53 hosted zone ID for the custom domain"
        required: false
        default: ""
      certificate_arn:
        description: "Optional existing ACM certificate ARN in us-east-1 for the custom domain"
        required: false
        default: ""
      api_base_url:
        description: "Shared environment-router API base URL"
        required: false
        default: "https://app.loveheartbeat.com"
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      domain_name:
        type: string
        required: false
        default: ""
      hosted_zone_id:
        type: string
        required: false
        default: ""
      certificate_arn:
        type: string
        required: false
        default: ""
      api_base_url:
        type: string
        required: false
        default: "https://app.loveheartbeat.com"

env:
  AWS_REGION: us-east-1
  STAGE: ${{ inputs.stage || 'prod' }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: loveheartbeat-frontend-${{ inputs.stage || 'prod' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy role ARN
        id: resolve-role
        run: |
          ROLE="${{ secrets.AWS_DEPLOY_ROLE_ARN }}"
          if [[ "$ROLE" == arn:aws:iam::*:role/* ]]; then
            echo "arn=$ROLE" >> "$GITHUB_OUTPUT"
          else
            ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
            if [[ -z "$ACCOUNT_ID" ]]; then
              echo "AWS_DEPLOY_ROLE_ARN must be a full ARN or AWS_ACCOUNT_ID secret must be set." >&2
              exit 1
            fi
            echo "arn=arn:aws:iam::${ACCOUNT_ID}:role/${ROLE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.resolve-role.outputs.arn }}
          role-session-name: loveheartbeat-frontend-deploy
          audience: sts.amazonaws.com

      - name: Deploy frontend hosting stack
        id: deploy-hosting
        run: |
          STAGE="${{ env.STAGE }}"
          DOMAIN_NAME="${{ inputs.domain_name || '' }}"
          HOSTED_ZONE_ID="${{ inputs.hosted_zone_id || '' }}"
          CERTIFICATE_ARN="${{ inputs.certificate_arn || '' }}"

          if [[ -n "$DOMAIN_NAME" && -z "$HOSTED_ZONE_ID" ]]; then
            HOSTED_ZONE_ID=$(aws route53 list-hosted-zones --output json | jq -r --arg domain "$DOMAIN_NAME" '.HostedZones[] | select(.Name as $zone | ($domain + ".") | endswith($zone)) | .Id' | head -n1 | sed 's|/hostedzone/||')
          fi
          if [[ -n "$DOMAIN_NAME" && -z "$HOSTED_ZONE_ID" ]]; then
            echo "Could not find Route 53 hosted zone for ${DOMAIN_NAME}. Provide the hosted_zone_id workflow input." >&2
            exit 1
          fi

          PARAM_OVERRIDES="Stage=${STAGE}"
          if [[ -n "$DOMAIN_NAME" ]]; then
            PARAM_OVERRIDES="${PARAM_OVERRIDES} DomainName=${DOMAIN_NAME} HostedZoneId=${HOSTED_ZONE_ID}"
            [[ -n "$CERTIFICATE_ARN" ]] && PARAM_OVERRIDES="${PARAM_OVERRIDES} CertificateArn=${CERTIFICATE_ARN}"
          fi

          STACK_NAME="loveheartbeat-frontend-hosting-${STAGE}"

          # A stack whose first CREATE failed sits in ROLLBACK_COMPLETE, which `deploy`
          # refuses to update — so every later run fails for that reason instead of the
          # real one. Nothing is live in that state, so deleting it is safe.
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          if [[ "$STATUS" == "ROLLBACK_COMPLETE" || "$STATUS" == "REVIEW_IN_PROGRESS" ]]; then
            echo "Stack is $STATUS; deleting before redeploy."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi

          # Print the failing resource in the log instead of "run describe-stack-events".
          trap 'aws cloudformation describe-stack-events --stack-name "$STACK_NAME" \
            --query "reverse(StackEvents)[?ResourceStatusReason!=null] | [:10].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output text >&2' ERR

          aws cloudformation deploy \
            --template-file infrastructure/frontend-hosting.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides ${PARAM_OVERRIDES} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "bucket=$(output FrontendBucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(output CloudFrontDistributionId)" >> "$GITHUB_OUTPUT"

          if [[ -n "$DOMAIN_NAME" ]]; then
            FRONTEND_URL="https://${DOMAIN_NAME}"
          else
            FRONTEND_URL="https://$(output FrontendUrl)"
          fi
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Generate env routing token
        # Must match the token deploy-backend.yml derived for this stage, or the
        # router has no origin to send this frontend's requests to.
        id: env-token
        env:
          ROUTING_ROOT_KEY: ${{ secrets.ENV_ROUTING_ROOT_KEY }}
        run: |
          if [[ -z "$ROUTING_ROOT_KEY" ]]; then
            echo "Create the ENV_ROUTING_ROOT_KEY repository secret before building the frontend." >&2
            exit 1
          fi
          if [[ "${{ env.STAGE }}" != "dev" && "${{ env.STAGE }}" != "qa" && "${{ env.STAGE }}" != "prod" ]]; then
            echo "stage must be dev, qa, or prod when using the shared environment router." >&2
            exit 1
          fi
          TOKEN=$(STAGE="${{ env.STAGE }}" python3 -c 'import hashlib,hmac,os; print(hmac.new(os.environ["ROUTING_ROOT_KEY"].encode(), os.environ["STAGE"].encode(), hashlib.sha256).hexdigest())')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix frontend

      - name: Compile theme assets
        # `compile`, not `compile:all`: the pages are React now, so the pug task would
        # only emit a second, stale copy of every one of them. The css/js/vendor tasks
        # still matter — frontend/public/assets is a symlink into public/assets, and
        # that whole tree is gitignored build output.
        run: npx gulp compile

      - name: Build static site
        working-directory: frontend
        run: npm run build

      - name: Inject runtime configuration
        # The build is environment-agnostic, so the API base URL and tenant domain are
        # written afterwards as a small script every page already loads. Rebuilding per
        # stage just to bake in a URL would make the artifact unpromotable.
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://app.loveheartbeat.com' }}
          ENV_TOKEN: ${{ steps.env-token.outputs.token }}
        run: |
          cat > frontend/out/assets/js/runtime-config.js <<EOF
          // Generated by deploy-frontend.yml — do not edit.
          window.__API_BASE_URL__ = '${API_BASE_URL}';
          window.__TENANT_BASE_DOMAIN__ = 'loveheartbeat.com';
          // Selects which backend the shared router forwards to. Stage-specific,
          // not a credential: the chosen backend still authenticates every request.
          window.__ENV_TOKEN__ = '${ENV_TOKEN}';
          EOF
          # No sed over the HTML any more: app/layout.tsx carries a blocking
          # <script src="/assets/js/runtime-config.js"> in <head> on every page.
          grep -q "__API_BASE_URL__" frontend/out/assets/js/runtime-config.js

      - name: Deploy to S3
        run: |
          # Only /_next/static/* is content-hashed, so only it may be immutable.
          # Everything else keeps a stable name across deploys — marking those
          # immutable pins a returning browser to a year-old runtime-config.js and
          # auth bundle, which is why sign-in used to work in incognito and nowhere
          # else. A CloudFront invalidation cannot reach a browser cache.
          # Hashed chunks go up first and without --delete, so the HTML that lands
          # next never references a chunk that is not there yet.
          aws s3 sync frontend/out/ s3://${{ steps.deploy-hosting.outputs.bucket }}/ \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/out/ s3://${{ steps.deploy-hosting.outputs.bucket }}/ --delete \
            --exclude "_next/static/*" --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.deploy-hosting.outputs.distribution_id }} \
            --paths "/*"
          echo "Frontend URL: ${{ steps.deploy-hosting.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
