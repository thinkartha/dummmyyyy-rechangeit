name: deploy-backend-dev

# Isolated dev backend. Deploys stage "dev" on every push to main that touches
# backend code or the infrastructure it depends on.

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infrastructure/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/deploy-backend-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      stage: dev
      frontend_url: https://dev.loveheartbeat.com
    secrets: inherit
