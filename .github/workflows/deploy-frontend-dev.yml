name: deploy-frontend-dev

# Dev frontend: dev.loveheartbeat.com.
# Deploys stage "dev" on every push to main that touches frontend code.

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "gulp/**"
      - "integration/**"
      - "gulpfile.js"
      - "package.json"
      - "package-lock.json"
      - "vendors.json"
      - "infrastructure/frontend-hosting.yaml"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/deploy-frontend-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      stage: dev
      domain_name: dev.loveheartbeat.com
    secrets: inherit
