name: bootstrap

# One-time bootstrap workflow.
# Run this manually from the GitHub UI to create the OIDC provider and IAM role
# that all other workflows assume. After it runs, copy the output role ARN into
# the GitHub repository secret AWS_DEPLOY_ROLE_ARN.

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region for the bootstrap stack"
        required: true
        default: "us-east-1"
      github_org:
        description: "GitHub organization or user name"
        required: true
      repository_name:
        description: "GitHub repository name"
        required: true
      branch_filter:
        description: "Branch filter for OIDC trust (e.g. refs/heads/main or *)"
        required: true
        default: "refs/heads/main"

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ github.event.inputs.aws_region }}
          # Use an existing admin credential (IAM user/role) for the very first run.
          # After bootstrap, all deployments use the OIDC role created here.
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          special-characters-workaround: true

      - name: Deploy GitHub OIDC bootstrap stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/github-oidc.yaml \
            --stack-name loveheartbeat-github-oidc-bootstrap \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              GitHubOrg=${{ github.event.inputs.github_org }} \
              RepositoryName=${{ github.event.inputs.repository_name }} \
              BranchFilter=${{ github.event.inputs.branch_filter }}

      - name: Output deploy role ARN
        run: |
          ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name loveheartbeat-github-oidc-bootstrap \
            --query "Stacks[0].Outputs[?OutputKey=='GitHubActionsRoleArn'].OutputValue" \
            --output text)
          echo "Bootstrap complete. Add this ARN to GitHub Secrets as AWS_DEPLOY_ROLE_ARN:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ROLE_ARN\`" >> "$GITHUB_STEP_SUMMARY"
