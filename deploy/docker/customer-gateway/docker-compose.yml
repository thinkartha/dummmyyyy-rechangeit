version: "3.9"

services:
  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: customer-apisix
    ports:
      - "9080:9080"
    volumes:
      - ./config:/usr/local/apisix/conf
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mock-upstream:
        condition: service_started

  gateway-agent:
    build:
      context: ../../../gateway-agent
      dockerfile: Dockerfile
    container_name: customer-gateway-agent
    environment:
      - CONTROL_PLANE_URL=http://mock-control-plane:8000
      - GATEWAY_PUBLIC_HOSTNAME=api.customer.com
      - GATEWAY_ENROLLMENT_TOKEN=local-one-time-token
      - APISIX_CONFIG_PATH=/shared/apisix.yaml
      - AGENT_STATE_DIR=/var/lib/gateway-agent
    volumes:
      - ./config:/shared
      - gateway-agent-state:/var/lib/gateway-agent
    depends_on:
      apisix:
        condition: service_healthy
      mock-control-plane:
        condition: service_started

  mock-control-plane:
    image: python:3.12-alpine
    container_name: customer-gateway-control-plane
    command: ["python", "/app/mock-control-plane.py"]
    ports:
      - "18080:8000"
    volumes:
      - ./mock-control-plane.py:/app/mock-control-plane.py:ro

  mock-upstream:
    image: nginx:alpine
    container_name: customer-origin
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  telemetry:
    image: ghcr.io/open-telemetry/opentelemetry-collector:latest
    container_name: customer-telemetry
    ports:
      - "4318:4318"

networks:
  default:
    name: customer-gateway-demo

volumes:
  gateway-agent-state:
